<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}私人 AI / Private AI{% endblock %}</title><style>
:root{color-scheme:light;--ink:#20352e;--muted:#728078;--line:#e2e7e0;--green:#285c47;--paper:#f8faf6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,textarea{font:inherit}button,a,input,textarea{outline-color:#659b80}button,.button{cursor:pointer;border:0;border-radius:10px;background:var(--green);color:white;padding:11px 18px;text-decoration:none}button:disabled{opacity:.5;cursor:wait}a{color:var(--green)}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:white;color:var(--ink)}textarea{resize:vertical}label{display:block;margin:16px 0 6px;font-weight:600}.muted{color:var(--muted)}.error{color:#ae403a;background:#fff0ec;padding:10px;border-radius:8px}.brand{font-weight:750;letter-spacing:.05em}.mark{display:inline-grid;place-items:center;width:35px;height:35px;border-radius:12px;background:#dceadf;color:var(--green);margin-right:9px}.card{width:min(440px,calc(100% - 32px));margin:10vh auto;background:white;border:1px solid var(--line);padding:32px;border-radius:20px;box-shadow:0 12px 50px #20352e08}.card h1{font-size:28px;margin:24px 0 4px}.card button{width:100%;margin-top:22px}.helptext{font-size:12px;color:var(--muted)}ul.errorlist{color:#ae403a;padding-left:20px}footer{font-size:12px;color:var(--muted);margin-top:24px} 
{% block style %}{% endblock %}</style></head><body>{% include "ui_bilingual.html" %}{% if user.is_authenticated %}{% include "gpu_pair.html" %}{% endif %}{% block body %}{% endblock %}{% if idle_shutdown_enabled and user.is_authenticated %}{% include "presence.html" %}{% endif %}</body></html>
