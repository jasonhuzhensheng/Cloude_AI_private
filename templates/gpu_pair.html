<style>
.gpu-pair{max-width:1200px;margin:16px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gpu-pair article{background:white;border:1px solid var(--line);border-radius:12px;padding:14px 18px}.gpu-pair strong{display:block;font-size:16px}.gpu-pair p{margin:5px 0;overflow-wrap:anywhere}.gpu-pair small{color:var(--muted)}@media(max-width:650px){.gpu-pair{grid-template-columns:1fr}}
</style>
<section class="gpu-pair" aria-label="双显卡状态 / Dual GPU status">
<article><strong>视频 GPU / Video GPU</strong><p id="pair-video-state">正在检查 / Checking</p><p id="pair-video-metrics">GPU — · VRAM —</p><small id="pair-video-time"></small></article>
<article><strong>图片 GPU / Photo GPU</strong><p id="pair-photo-state">正在检查 / Checking</p><p id="pair-photo-metrics">GPU — · VRAM —</p><small id="pair-photo-time">按需启动，图片队列完成后停止 / Starts on demand; stops after the photo queue finishes</small></article>
</section>
<script>
(()=>{let busy=false;const el=id=>document.getElementById(id);function metrics(d){const v=Number.isFinite(d.utilization)?Math.round(d.utilization)+'%':'—';const m=Number.isFinite(d.memory_used_mib)&&d.memory_total_mib>0?(100*d.memory_used_mib/d.memory_total_mib).toFixed(1)+'% · '+(d.memory_used_mib/1024).toFixed(1)+' / '+(d.memory_total_mib/1024).toFixed(1)+' GiB':'—';return 'GPU '+v+' · 显存 / VRAM '+m}
async function update(){if(busy||document.hidden)return;busy=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);try{const r=await fetch('{% url "gpu-status" %}',{cache:'no-store',signal:controller.signal});if(!r.ok||r.redirected)throw Error();const d=await r.json();el('pair-video-state').textContent=d.available?d.name+' · '+window.uiBilingual(d.state):'状态不可用 / Status unavailable';el('pair-video-metrics').textContent=d.available?metrics(d):'GPU — · VRAM —';el('pair-video-time').textContent='更新时间 / Updated '+new Date(d.sampled_at).toLocaleTimeString();const p=d.photo_gpu||{};el('pair-photo-time').textContent=p.enabled?'按需启动，队列完成后停止 / Starts on demand; stops after the queue finishes':'独立图片模式暂未启用 / Dedicated photo mode is not enabled';el('pair-photo-state').textContent=(p.configured||p.enabled)?p.stage:'未启用独立图片显卡 / Dedicated photo GPU not enabled';el('pair-photo-metrics').textContent=p.provider_status==='EXITED'?'已停止 · 无运行指标 / Stopped · No live metrics':metrics(p);}catch(e){for(const type of ['video','photo']){el('pair-'+type+'-state').textContent='状态暂不可用 / Status temporarily unavailable';el('pair-'+type+'-metrics').textContent='GPU — · VRAM —'}}finally{clearTimeout(timer);busy=false}}
update();setInterval(update,5000);document.addEventListener('visibilitychange',update);})();
</script>
